<style>

    font-size:13px;

  .card{

    background:var(--primary-light);

    display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;

  .check-row input{width:18px;height:18px;accent-color:var(--primary);cursor:pointer;}

  .draft-row{display:flex;gap:6px;margin-bottom:8px;align-items:center;}
  .draft-row .rm{

  .modal-overlay{

  #toast{

  .note-box{font-size:12.5px;color:var(--warning);background:var(--warning-light);padding:4px 8px;border-radius:6px;margin-top:6px;}
  .paid-badge{background:var(--success-light);color:var(--success);padding:2px 6px;border-radius:4px;font-size:11.5px;font-weight:700;margin-right:4px;}

<body>
<div id="app">
  <header class="top">
    <div>
      <h1>لوحة تحكم الصيدلية</h1>
      <p>متابعة الأصناف والحجوزات وعملاء الصرف الشهري والنظام الذكي</p>
    </div>
    <button class="night-mode-btn" id="nightModeToggle" title="تبديل الوضع الليلي">🌙 <span id="nightModeText">ليلي</span></button>
  </header>
  <nav class="tabs" id="tabsNav"></nav>
  <main id="tabContent"></main>
</div>
<div id="toast"></div>

<script>
/* ================= SUPABASE & LOCAL SYNC CONFIG ================= */
const SUPABASE_URL = 'https://bgcttovuwvmrjfufqinv.supabase.co/rest/v1/';
const SUPABASE_KEY = 'sb_publishable_yy0_ZA7bnwENS6BHO6oaIQ_CMVriKnb';

function sbHeaders(prefer){
  return {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer '+SUPABASE_KEY,
    'Content-Type': 'application/json',
    'Prefer': prefer || 'return=representation'
  };
}

async function sbGet(table){
  try {
    const res = await fetch(SUPABASE_URL+table+'?select=*&order=created_at.desc', { headers: sbHeaders() });
    if(!res.ok) throw new Error();
    const data = await res.json();
    localStorage.setItem('ph_cache_'+table, JSON.stringify(data));
    return data;
  } catch(e) {
    return JSON.parse(localStorage.getItem('ph_cache_'+table) || '[]');
  }
}

async function sbInsert(table, row){
  try {
    const res = await fetch(SUPABASE_URL+table, { method:'POST', headers: sbHeaders('return=representation'), body: JSON.stringify(row) });
    if(!res.ok) throw new Error(await res.text());
    const data = await res.json();
    return data[0] || row;
  } catch(e) {
    return row;
  }
}

async function sbUpdate(table, id, patch){
  try {
    const res = await fetch(SUPABASE_URL+table+'?id=eq.'+encodeURIComponent(id), { method:'PATCH', headers: sbHeaders('return=representation'), body: JSON.stringify(patch) });
    if(!res.ok) throw new Error();
    const data = await res.json();
    return data[0] || patch;
  } catch(e) {
    return patch;
  }
}

async function sbDelete(table, id){
  try {
    await fetch(SUPABASE_URL+table+'?id=eq.'+encodeURIComponent(id), { method:'DELETE', headers: sbHeaders('return=minimal') });
  } catch(e) {}
  return true;
}

/* Night Mode Setup */
function initNightMode(){
  const btn = document.getElementById('nightModeToggle');
  const txt = document.getElementById('nightModeText');
  const isDark = localStorage.getItem('ph_night_mode') === 'true';
  
  if(isDark){
    document.body.classList.add('dark-mode');
    txt.textContent = 'نهاري';
    btn.innerHTML = '☀️ <span id="nightModeText">نهاري</span>';
  }

  btn.onclick = ()=>{
    document.body.classList.toggle('dark-mode');
    const active = document.body.classList.contains('dark-mode');
    localStorage.setItem('ph_night_mode', active);
    if(active){
      btn.innerHTML = '☀️ <span id="nightModeText">نهاري</span>';
      showToast('تم تفعيل الوضع الليلي');
    } else {
      btn.innerHTML = '🌙 <span id="nightModeText">ليلي</span>';
      showToast('تم تفعيل الوضع العادي');
    }
  };
}

/* Master Item Dictionary */
let itemDatabase = JSON.parse(localStorage.getItem('ph_item_database') || '{}');

function registerItemCodeInput(inputEl, descInputEl){
  if(!inputEl || !descInputEl) return;
  inputEl.oninput = ()=>{
    const val = inputEl.value.trim();
    if(itemDatabase[val]){
      descInputEl.value = itemDatabase[val];
      descInputEl.dispatchEvent(new Event('input'));
    }
  };
}

function mapStockRow(r){ return { id:r.id||uid(), itemNo:r.item_no||r.itemNo, itemDesc:r.item_desc||r.itemDesc, type:r.type, unit:r.unit, qty:r.quantity!==undefined?r.quantity:r.qty, staffCode:r.staff_code||r.staffCode||'', createdAt:r.created_at||new Date().toISOString() }; }
function buildStockRow(o){ return { id:o.id, item_no:o.itemNo, item_desc:o.itemDesc, type:o.type, unit:o.unit, quantity:o.qty, staff_code:o.staffCode }; }

function mapReservationRow(r){ 
  return { 
    id: r.id || uid(), 
    customerName: r.customer_name || r.customerName, 
    phone: r.customer_phone || r.phone, 
    items: r.items || [], 
    note: r.note || '', 
    status: r.status || 'لم يتم التواصل', 
    staffCode: r.staff_code || r.staffCode || '', 
    createdAt: r.created_at || new Date().toISOString() 
  }; 
}
function buildReservationRow(o){ 
  return { 
    id: o.id, 
    customer_name: o.customerName, 
    customer_phone: o.phone, 
    items: o.items, 
    note: o.note, 
    status: o.status, 
    staff_code: o.staffCode 
  }; 
}

function monthlyItemsPayload(c){
  return { dueDay:c.dueDay, companyName:c.companyName||'', cardNo:c.cardNo||'', hasCardImage:!!c.hasCardImage, cardImageData:c.cardImageData||null, cycle:c.cycle, list:c.items||[] };
}
function mapMonthlyRow(r){
  const it = r.items || {};
  return {
    id:r.id||uid(), name:r.customer_name||r.name, phone:r.phone, staffCode:r.staff_code||r.staffCode||'',
    isContract: r.contract_type==='contract',
    dueDay: it.dueDay || 1, companyName: it.companyName || '', cardNo: it.cardNo || '',
    hasCardImage: !!it.hasCardImage, cardImageData: it.cardImageData || null,
    items: it.list || [],
    cycle: it.cycle || { monthKey: todayInfo().monthKey, contacted:false, dispensed:false },
    history: r.history || [], createdAt: r.created_at || new Date().toISOString()
  };
}
function buildMonthlyRow(o){
  return {
    id:o.id, customer_name:o.name, phone:o.phone, staff_code:o.staffCode,
    contract_type: o.isContract? 'contract':'normal',
    items: monthlyItemsPayload(o), history: o.history||[]
  };
}

async function fetchStockIssues(){ 
  try {
    const res = await sbGet('stock_issues');
    if(res && Array.isArray(res)){
      state.stock = res.map(mapStockRow);
      localStorage.setItem('ph_cache_stock', JSON.stringify(state.stock));
      return state.stock;
    }
  } catch(e) {}
  return JSON.parse(localStorage.getItem('ph_cache_stock') || '[]').map(mapStockRow);
}

async function fetchReservations(){ 
  try {
    const res = await sbGet('reservations');
    if(res && Array.isArray(res)){
      state.reservations = res.map(mapReservationRow);
      localStorage.setItem('ph_cache_reservations', JSON.stringify(state.reservations));
      return state.reservations;
    }
  } catch(e) {}
  return JSON.parse(localStorage.getItem('ph_cache_reservations') || '[]').map(mapReservationRow);
}

async function fetchMonthlyCustomers(){ 
  try {
    const res = await sbGet('monthly_customers');
    if(res && Array.isArray(res)){
      state.monthly = res.map(mapMonthlyRow);
      localStorage.setItem('ph_cache_monthly', JSON.stringify(state.monthly));
      return state.monthly;
    }
  } catch(e) {}
  return JSON.parse(localStorage.getItem('ph_cache_monthly') || '[]').map(mapMonthlyRow);
}

let state = {
  stock: [], reservations: [], monthly: [],
  activeTab: 'stock', monthlySub: 'new',
  search: { stock:'', reservations:'', archive:'', monthly:'' },
  filters: { stockType:'all', stockUnit:'all', resStatus:'all', monthlyType:'all' }
};

function uid(){ return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayInfo(){ const d = new Date(); return { day:d.getDate(), monthKey: d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0') }; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t); showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function fmtDate(iso){ if(!iso) return ''; return new Date(iso).toLocaleDateString('ar-EG', {year:'numeric',month:'2-digit',day:'2-digit'}); }

function exportToExcel(filename, rows){
  if(!rows || !rows.length){ showToast('لا توجد بيانات للتصدير'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "الشيت");
  XLSX.writeFile(wb, filename + ".xlsx");
  showToast('تم تصدير ملف Excel بنجاح');
}

function openEditModal(title, htmlContent, onSave){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>✏️ ${esc(title)}</h3>
      ${htmlContent}
      <div class="modal-actions">
        <button class="btn secondary" id="editCancel">إلغاء</button>
        <button class="btn" id="editSave">حفظ التعديلات</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#editCancel').onclick = ()=>document.body.removeChild(overlay);
  overlay.querySelector('#editSave').onclick = async ()=>{
    const success = await onSave(overlay);
    if(success!==false) document.body.removeChild(overlay);
  };
}

const TAB_DEFS = [
  {id:'stock', label:'مشاكل أرصدة الأصناف'},
  {id:'reservations', label:'حجوزات العملاء النشطة'},
  {id:'archive', label:'أرشيف الحجوزات'},
  {id:'monthly', label:'عميل شهري'},
  {id:'database', label:'قاعدة البيانات والأصناف'}
];

function renderTabsNav(){
  const nav = document.getElementById('tabsNav');
  nav.innerHTML = TAB_DEFS.map(t=>`<button data-tab="${t.id}" class="${state.activeTab===t.id?'active':''}">${t.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ state.activeTab = b.dataset.tab; renderTabsNav(); renderActiveTab(); };
  });
}

function renderActiveTab(){
  const el = document.getElementById('tabContent');
  el.innerHTML = '';
  if(state.activeTab==='stock') mountStockTab(el);
  else if(state.activeTab==='reservations') mountReservationsTab(el);
  else if(state.activeTab==='archive') mountArchiveTab(el);
  else if(state.activeTab==='monthly') mountMonthlyTab(el);
  else if(state.activeTab==='database') mountDatabaseTab(el);
}

/* TAB 1: مشاكل أرصدة الأصناف */
function mountStockTab(root){

    <div class="card">

          <button class="refresh" id="stRefresh">⟳ تحديث</button>
        </div>
      </div>
      <div class="searchbar"><input type="search" id="stSearch" placeholder="ابحث برقم الصنف أو الاسم..."></div>
      <div class="filters">
        <select id="stFilterType"><option value="all">كل الأنواع</option><option value="عجز">عجز فقط</option><option value="زيادة">زيادة فقط</option></select>

  `;

  root.querySelector('#stFilterUnit').onchange = (e)=>{ state.filters.stockUnit = e.target.value; renderStockList(); };
  root.querySelector('#stRefresh').onclick = async ()=>{
    await fetchStockIssues(); renderStockList(); showToast('تم التحديث من السحابة');
  };
  root.querySelector('#stExport').onclick = ()=>{
    const data = state.stock.map((it, idx)=>({ 'م': idx+1, 'رقم الصنف': it.itemNo, 'اسم الصنف': it.itemDesc, 'النوع': it.type, 'الوحدة': it.unit, 'الكمية': it.qty, 'كود الزميل': it.staffCode, 'تاريخ الإدخال': fmtDate(it.createdAt) }));
    exportToExcel('مشاكل_أرصدة_الأصناف', data);

async function onAddStockIssue(){
  const itemNo = document.getElementById('stItemNo').value.trim();
  const itemDesc = document.getElementById('stItemDesc').value.trim();
  const type = document.getElementById('stType').value;
  const unit = document.getElementById('stUnit').value;
  const qty = document.getElementById('stQty').value.trim();
  const staffCode = document.getElementById('stStaffCode').value.trim();
  
  if(!itemNo || !itemDesc){ showToast('من فضلك ادخل رقم واسم الصنف'); return; }
  if(!staffCode){ showToast('من فضلك ادخل كود الزميل القائم بالإدخال'); return; }
  
  const newItem = { id:uid(), itemNo, itemDesc, type, unit, qty: qty===''? null : Number(qty), staffCode, createdAt: new Date().toISOString() };
  await sbInsert('stock_issues', buildStockRow(newItem));
  await fetchStockIssues();
  document.getElementById('stItemNo').value=''; document.getElementById('stItemDesc').value=''; document.getElementById('stQty').value=''; document.getElementById('stStaffCode').value='';
  renderStockList(); showToast('تمت الإضافة بنجاح');
}

function renderStockList(){
  const list = document.getElementById('stList');
  if(!list) return;
  const q = state.search.stock.trim().toLowerCase();
  const items = state.stock.filter(it=>{
    if(state.filters.stockType!=='all' && it.type!==state.filters.stockType) return false;
    if(state.filters.stockUnit!=='all' && it.unit!==state.filters.stockUnit) return false;
    if(q && !(it.itemNo.toLowerCase().includes(q) || it.itemDesc.toLowerCase().includes(q))) return false;
    return true;
  });
  if(items.length===0){ list.innerHTML = `<div class="empty-state">لا توجد مشاكل أرصدة مطابقة حالياً</div>`; return; }
  
  list.innerHTML = items.map((it, idx)=>`
    <div class="item-card">
      <div class="top-row">
        <div>
          <div class="title">
            <span>#${idx+1} ${esc(it.itemDesc)}</span>
            <button class="edit-btn-icon" data-id="${it.id}" title="تعديل">✏️</button>
          </div>
          <div class="sub">رقم الصنف: ${esc(it.itemNo)} · الوحدة: ${esc(it.unit)}${(it.qty!==null && it.qty!==undefined && it.qty!=='') ? ' · الكمية: '+esc(it.qty) : ''}</div>
          <div class="staff-tag">القائم بالإدخال: ${esc(it.staffCode || 'غير محدد')}</div>
        </div>
        <span class="badge ${it.type==='عجز'?'red':'green'}">${esc(it.type)}</span>
      </div>
      <label class="check-row"><input type="checkbox" data-id="${it.id}" class="stDoneChk"> تم تعديل الرصيد</label>
    </div>
  `).join('');

  list.querySelectorAll('.edit-btn-icon').forEach(btn=>{
    btn.onclick = ()=>{
      const it = state.stock.find(x=>x.id===btn.dataset.id);
      if(!it) return;
      openEditModal('تعديل مشكلة رصيد', `
        <label>رقم الصنف</label><input type="text" id="edItemNo" value="${esc(it.itemNo)}">
        <label>اسم الصنف</label><input type="text" id="edItemDesc" value="${esc(it.itemDesc)}">
        <label>النوع</label><select id="edType"><option value="عجز" ${it.type==='عجز'?'selected':''}>عجز</option><option value="زيادة" ${it.type==='زيادة'?'selected':''}>زيادة</option></select>
        <label>الوحدة</label><select id="edUnit"><option value="علبة" ${it.unit==='علبة'?'selected':''}>علبة</option><option value="وحدة" ${it.unit==='وحدة'?'selected':''}>وحدة</option></select>
        <label>الكمية</label><input type="number" id="edQty" value="${esc(it.qty||'')}">
        <label>كود الزميل</label><input type="text" id="edStaff" value="${esc(it.staffCode)}">
      `, async (modal)=>{
        const edNoInput = modal.querySelector('#edItemNo');
        const edDescInput = modal.querySelector('#edItemDesc');
        registerItemCodeInput(edNoInput, edDescInput);

        const patch = {
          itemNo: edNoInput.value.trim(),
          itemDesc: edDescInput.value.trim(),
          type: modal.querySelector('#edType').value,
          unit: modal.querySelector('#edUnit').value,
          qty: modal.querySelector('#edQty').value ? Number(modal.querySelector('#edQty').value) : null,
          staffCode: modal.querySelector('#edStaff').value.trim()
        };
        await sbUpdate('stock_issues', it.id, buildStockRow({...it, ...patch}));
        await fetchStockIssues(); renderStockList(); showToast('تم التعديل بنجاح');
      });
    };
  });

  list.querySelectorAll('.stDoneChk').forEach(chk=>{
    chk.onclick = async ()=>{
      const id = chk.dataset.id;
      await sbDelete('stock_issues', id);
      await fetchStockIssues();
      renderStockList(); showToast('تم إزالة الصنف');
    };
  });
}

          <input type="checkbox" data-i="${i}" data-f="isPaid" class="draftChk" ${row.isPaid?'checked':''} style="width:16px;height:16px;accent-color:var(--primary);">

  });

  wrap.querySelectorAll('.draftChk').forEach(chk=>{
    chk.onchange = ()=>{ reservationDraftItems[chk.dataset.i].isPaid = chk.checked; };
  });

async function onSaveReservation(){
  const name = document.getElementById('resName').value.trim();
  const phone = document.getElementById('resPhone').value.trim();
  const note = document.getElementById('resNote').value.trim();
  const staffCode = document.getElementById('resStaffCode').value.trim();
  const items = reservationDraftItems.filter(r=>r.itemNo.trim() || r.itemDesc.trim()).map(r=>({
    itemNo:r.itemNo.trim(), itemDesc:r.itemDesc.trim(), qty:r.qty.trim(), unit:r.unit||'علبة', branch:r.branch.trim(), isPaid:!!r.isPaid
  }));

  if(!name || !phone){ showToast('من فضلك ادخل اسم العميل ورقم الموبايل'); return; }
  if(items.length===0){ showToast('من فضلك ادخل صنف واحد على الأقل'); return; }
  if(!staffCode){ showToast('من فضلك ادخل كود الزميل القائم بالإدخال'); return; }

  const newRes = {
    id: uid(),
    customerName: name,
    phone: phone,
    items: items,
    note: note,
    status: 'لم يتم التواصل',
    staffCode: staffCode,
    createdAt: new Date().toISOString()
  };
  
  await sbInsert('reservations', buildReservationRow(newRes));
  await fetchReservations();
  
  document.getElementById('resName').value = '';
  document.getElementById('resPhone').value = '';
  document.getElementById('resNote').value = '';
  document.getElementById('resStaffCode').value = '';
  reservationDraftItems = [{itemNo:'', itemDesc:'', qty:'', unit:'علبة', branch:'', isPaid:false}];
  renderResDraftRows();
  renderReservationsList();
  
  const itemsText = items.map((it, i) => `${i+1}. *${it.itemDesc}* (رقم: ${it.itemNo || 'بدون'}) - الكمية: ${it.qty || '1'} ${it.unit} ${it.branch ? 'من فرع: '+it.branch : ''} ${it.isPaid ? '✅ مدفوع' : '❌ غير مدفوع'}`).join('\n');
  const waMsg = `مرحباً بك يا استاذ/ة *${name}* 🩺\n\nنحيطك علماً بأنه تم تسجيل أصناف حجزك في الصيدلية:\n${itemsText}\n\n${note ? 'ملاحظة: '+note+'\n' : ''}\nنتمنى لك دوام الصحة والعافية!`;
  const cleanPhone = phone.replace(/\D/g,'');
  const waUrl = `https://wa.me/2${cleanPhone}?text=`+encodeURIComponent(waMsg);
  
  showToast('تم حفظ الحجز بنجاح وجاهز للإرسال عبر واتساب');
  if(confirm('هل تريد فتح الواتساب لإرسال تفاصيل الحجز للعميل الآن؟')){
    window.open(waUrl, '_blank');
  }
}

function renderReservationsList(){
  const list = document.getElementById('resList');
  if(!list) return;
  const q = state.search.reservations.trim().toLowerCase();
  const items = state.reservations.filter(r=>{
    if(r.status==='أرشيف') return false;
    if(state.filters.resStatus!=='all' && r.status!==state.filters.resStatus) return false;
    if(q){
      const matchName = r.customerName.toLowerCase().includes(q);
      const matchPhone = r.phone.toLowerCase().includes(q);
      const matchItem = r.items.some(i => i.itemDesc.toLowerCase().includes(q) || i.itemNo.toLowerCase().includes(q));
      if(!matchName && !matchPhone && !matchItem) return false;
    }
    return true;

    <div class="item-card" style="opacity:0.85;">
      <div class="top-row">
        <div>
          <div class="title"><span>#${idx+1} ${esc(r.customerName)} (${esc(r.phone)})</span></div>
          <div class="sub">تاريخ الإنشاء: ${fmtDate(r.createdAt)} · القائم بالإدخال: ${esc(r.staffCode || 'غير محدد')}</div>
        </div>
        <span class="badge grey">مؤرشف</span>
      </div>
      <ul class="med-list">
        ${r.items.map(it=>`<li><strong>${esc(it.itemDesc)}</strong> - كمية: ${esc(it.qty || '1')} ${esc(it.unit || 'علبة')}</li>`).join('')}
      </ul>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button class="btn small secondary restoreResBtn" data-id="${r.id}" style="flex:1;">🔄 استعادة للحجوزات النشطة</button>
        <button class="btn small danger deleteResBtn" data-id="${r.id}" style="flex:0 0 auto;">🗑️ حذف نهائي</button>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.restoreResBtn').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      const r = state.reservations.find(x=>x.id===id);
      if(r){
        r.status = 'لم يتم التواصل';
        await sbUpdate('reservations', id, buildReservationRow(r));
        await fetchReservations();
        renderArchiveList();
        showToast('تمت استعادة الحجز');
      }
    };
  });

  list.querySelectorAll('.deleteResBtn').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm('هل أنت متأكد من حذف هذا الحجز نهائياً؟')) return;
      const id = btn.dataset.id;
      await sbDelete('reservations', id);
      await fetchReservations();
      renderArchiveList();
      showToast('تم الحذف النهائي');
    };
  });
}

/* TAB 4: عميل شهري */
let monthlyDraftItems = [{name:'', dose:''}];

function mountMonthlyTab(root){
  monthlyDraftItems = [{name:'', dose:''}];
  root.innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button class="btn ${state.monthlySub==='new'?'':'secondary'}" id="subNewBtn" style="flex:1;margin-top:0;">إضافة عميل جديد</button>
      <button class="btn ${state.monthlySub==='list'?'':'secondary'}" id="subListBtn" style="flex:1;margin-top:0;">قائمة العملاء والمتابعة</button>
    </div>
    <div id="monthlySubContainer"></div>
  `;
  root.querySelector('#subNewBtn').onclick = ()=>{ state.monthlySub='new'; mountMonthlyTab(root); };
  root.querySelector('#subListBtn').onclick = ()=>{ state.monthlySub='list'; mountMonthlyTab(root); };

  const subCont = root.querySelector('#monthlySubContainer');
  if(state.monthlySub==='new') renderMonthlyNewForm(subCont);
  else renderMonthlyListContainer(subCont);
}

function renderMonthlyNewForm(container){
  container.innerHTML = `
    <div class="card">
      <p class="section-title">تسجيل عميل صرف شهري جديد</p>
      <div class="row">
        <div><label>اسم العميل</label><input type="text" id="mName" placeholder="اسم العميل"></div>
        <div><label>رقم الموبايل</label><input type="tel" id="mPhone" placeholder="رقم الموبايل"></div>
      </div>
      <div class="row">
        <div><label>نوع العميل</label><select id="mContractType"><option value="contract">تأمين / تعاقد شركة</option><option value="normal">نقدي / حر</option></select></div>
        <div><label>يوم الاستحقاق الشهري (1-31)</label><input type="number" id="mDueDay" min="1" max="31" value="1"></div>
      </div>
      <div id="contractFields">
        <label>اسم الشركة أو الجهة</label><input type="text" id="mCompanyName" placeholder="مثال: مصر للتأمين، بتروجيت...">
        <label>رقم الكرنيه / الكارت</label><input type="text" id="mCardNo" placeholder="رقم الكرنيه">
        <label>صورة الكرنيه (اختياري)</label><input type="file" id="mCardImg" accept="image/*">
      </div>
      <label>أدوية الصرف الشهري</label>
      <div id="mItemsWrap"></div>
      <button class="btn ghost" id="mAddMedBtn">+ إضافة دواء آخر</button>
      <label>كود الزميل (القائم بالإدخال) *</label><input type="text" id="mStaffCode" placeholder="أدخل كودك الوظيفي">
      <button class="btn" id="mSaveBtn">حفظ عميل الصرف الشهري</button>
    </div>
  `;

  const contractTypeSel = container.querySelector('#mContractType');
  const contractFields = container.querySelector('#contractFields');
  contractTypeSel.onchange = ()=>{ contractFields.style.display = contractTypeSel.value==='contract' ? 'block' : 'none'; };

  renderMonthlyMedRows();
  container.querySelector('#mAddMedBtn').onclick = ()=>{ monthlyDraftItems.push({name:'',dose:''}); renderMonthlyMedRows(); };
  container.querySelector('#mSaveBtn').onclick = onSaveMonthlyCustomer;
}

function renderMonthlyMedRows(){
  const wrap = document.getElementById('mItemsWrap');
  if(!wrap) return;
  wrap.innerHTML = monthlyDraftItems.map((row, i)=>`
    <div class="draft-row" style="margin-bottom:6px;">
      <input type="text" placeholder="اسم الدواء وصناعته" value="${esc(row.name)}" data-i="${i}" data-f="name" class="mMedInput" style="flex:2;">
      <input type="text" placeholder="الجرعة (مثال: قرص يومياً)" value="${esc(row.dose)}" data-i="${i}" data-f="dose" class="mMedInput" style="flex:2;">
      ${monthlyDraftItems.length>1 ? `<button class="rm" data-i="${i}">✕</button>` : ''}
    </div>
  `).join('');

  wrap.querySelectorAll('.mMedInput').forEach(inp=>{
    inp.oninput = ()=>{ monthlyDraftItems[inp.dataset.i][inp.dataset.f] = inp.value; };
  });
  wrap.querySelectorAll('.rm').forEach(btn=>{
    btn.onclick = ()=>{ monthlyDraftItems.splice(Number(btn.dataset.i),1); renderMonthlyMedRows(); };
  });
}

async function onSaveMonthlyCustomer(){
  const name = document.getElementById('mName').value.trim();
  const phone = document.getElementById('mPhone').value.trim();
  const isContract = document.getElementById('mContractType').value==='contract';
  const dueDay = Number(document.getElementById('mDueDay').value) || 1;
  const companyName = isContract ? document.getElementById('mCompanyName').value.trim() : '';
  const cardNo = isContract ? document.getElementById('mCardNo').value.trim() : '';
  const staffCode = document.getElementById('mStaffCode').value.trim();
  const items = monthlyDraftItems.filter(r=>r.name.trim()).map(r=>({ name:r.name.trim(), dose:r.dose.trim() }));

  if(!name || !phone){ showToast('من فضلك ادخل اسم العميل ورقم الموبايل'); return; }
  if(items.length===0){ showToast('من فضلك ادخل دواء واحد على الأقل'); return; }
  if(!staffCode){ showToast('من فضلك ادخل كود الزميل القائم بالإدخال'); return; }

  const fileInput = document.getElementById('mCardImg');
  let cardImageData = null;
  let hasCardImage = false;
  if(fileInput && fileInput.files && fileInput.files[0]){
    hasCardImage = true;
    cardImageData = await new Promise(resolve=>{
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(fileInput.files[0]);
    });
  }

  const newCust = {
    id: uid(),
    name, phone, staffCode, isContract,
    dueDay, companyName, cardNo, hasCardImage, cardImageData,
    items,
    cycle: { monthKey: todayInfo().monthKey, contacted:false, dispensed:false },
    history: [],
    createdAt: new Date().toISOString()
  };

  await sbInsert('monthly_customers', buildMonthlyRow(newCust));
  await fetchMonthlyCustomers();
  showToast('تم حفظ العميل الشهري بنجاح');
  state.monthlySub = 'list';
  renderActiveTab();
}

function renderMonthlyListContainer(container){
  container.innerHTML = `
    <div class="card">
      <div class="section-title">
        <span>قائمة عملاء الصرف الشهري</span>
        <div class="actions">
          <button class="export-btn" id="mExport">📊 تصدير للأكسل</button>
          <button class="refresh" id="mRefresh">⟳ تحديث</button>
        </div>
      </div>
      <div class="searchbar"><input type="search" id="mSearch" placeholder="ابحث باسم العميل أو الشركة..."></div>
      <div class="filters">
        <select id="mFilterType"><option value="all">كل العملاء</option><option value="contract">تعاقد / تأمين</option><option value="normal">نقدي</option></select>
      </div>
      <div id="mList"></div>
    </div>
  `;
  container.querySelector('#mSearch').oninput = (e)=>{ state.search.monthly = e.target.value; renderMonthlyList(); };
  container.querySelector('#mFilterType').onchange = (e)=>{ state.filters.monthlyType = e.target.value; renderMonthlyList(); };
  container.querySelector('#mRefresh').onclick = async ()=>{
    await fetchMonthlyCustomers(); renderMonthlyList(); showToast('تم التحديث من السحابة');
  };
  container.querySelector('#mExport').onclick = ()=>{
    const data = state.monthly.map((c, idx)=>({
      'م': idx+1, 'اسم العميل': c.name, 'الموبايل': c.phone, 'النوع': c.isContract?'تعاقد':'نقدي',
      'الشركة': c.companyName||'-', 'رقم الكرنيه': c.cardNo||'-', 'يوم الاستحقاق': c.dueDay,
      'الأدوية': c.items.map(i=>`${i.name} (${i.dose})`).join(' | '), 'كود الزميل': c.staffCode
    }));
    exportToExcel('عملاء_الصرف_الشهرى', data);
  };
  renderMonthlyList();
}

function renderMonthlyList(){
  const list = document.getElementById('mList');
  if(!list) return;
  const q = state.search.monthly.trim().toLowerCase();
  const currentMonthKey = todayInfo().monthKey;

  const items = state.monthly.filter(c=>{
    if(state.filters.monthlyType==='contract' && !c.isContract) return false;
    if(state.filters.monthlyType==='normal' && c.isContract) return false;
    if(q && !(c.name.toLowerCase().includes(q) || (c.companyName && c.companyName.toLowerCase().includes(q)) || c.phone.includes(q))) return false;
    return true;
  });

  if(items.length===0){ list.innerHTML = `<div class="empty-state">لا توجد عملاء صرف شهري مطابقة حالياً</div>`; return; }

  list.innerHTML = items.map((c, idx)=>{
    if(!c.cycle || c.cycle.monthKey !== currentMonthKey){
      c.cycle = { monthKey: currentMonthKey, contacted: false, dispensed: false };
    }
    const isDueSoon = c.dueDay <= (todayInfo().day + 3);

    return `
      <div class="item-card" style="${isDueSoon && !c.cycle.dispensed ? 'border-color:var(--warning);' : ''}">
        <div class="top-row">
          <div>
            <div class="title">
              <span>#${idx+1} ${esc(c.name)} (${esc(c.phone)})</span>
              <button class="edit-btn-icon" data-id="${c.id}" title="تعديل العميل">✏️</button>
            </div>
            <div class="sub">
              ${c.isContract ? `🏢 تعاقد: <strong>${esc(c.companyName)}</strong> (كرنيه: ${esc(c.cardNo)})` : '💵 عميل نقدي حر'} 
              · يوم الاستحقاق: الـ ${c.dueDay} من الشهر
            </div>
            <div class="staff-tag">القائم بالإدخال: ${esc(c.staffCode || 'غير محدد')}</div>
          </div>
          <span class="badge ${c.isContract?'amber':'green'}">${c.isContract?'تعاقد':'نقدي'}</span>
        </div>

        <ul class="med-list">
          ${c.items.map(i=>`<li><strong>${esc(i.name)}</strong> - الجرعة: ${esc(i.dose)}</li>`).join('')}
        </ul>

        ${c.hasCardImage && c.cardImageData ? `
          <div style="margin-top:8px;">
            <a href="${c.cardImageData}" target="_blank" style="font-size:12px;color:var(--primary);font-weight:700;text-decoration:underline;">🖼️ عرض صورة الكرنيه المرفقة</a>
          </div>
        ` : ''}

        <div style="display:flex;gap:12px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);align-items:center;flex-wrap:wrap;">
          <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;margin:0;">
            <input type="checkbox" data-id="${c.id}" data-field="contacted" class="mCycleChk" ${c.cycle.contacted?'checked':''} style="width:18px;height:18px;accent-color:var(--primary);">
            <span>تم التواصل للتذكير</span>
          </label>
          <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;margin:0;">
            <input type="checkbox" data-id="${c.id}" data-field="dispensed" class="mCycleChk" ${c.cycle.dispensed?'checked':''} style="width:18px;height:18px;accent-color:var(--primary);">
            <span>تم الصرف لهذا الشهر</span>
          </label>
          <a href="https://wa.me/2${c.phone.replace(/\D/g,'')}?text=`+encodeURIComponent(`مرحباً بك يا استاذ/ة ${c.name} 🩺\nنذكرك بموعد صرف أدوية الشهر الحالي (يوم ${c.dueDay} من الشهر).\nنتمنى لك دوام الصحة والعافية!`)" target="_blank" class="btn small secondary" style="text-decoration:none;margin-right:auto;">💬 واتساب للتذكير</a>
        </div>
      </div>
    `;
  }).join('');

  list.querySelectorAll('.mCycleChk').forEach(chk=>{
    chk.onchange = async ()=>{
      const id = chk.dataset.id;
      const field = chk.dataset.field;
      const c = state.monthly.find(x=>x.id===id);
      if(c){
        if(!c.cycle) c.cycle = { monthKey: currentMonthKey, contacted:false, dispensed:false };
        c.cycle[field] = chk.checked;
        await sbUpdate('monthly_customers', id, buildMonthlyRow(c));
        await fetchMonthlyCustomers();
        showToast('تم تحديث حالة دورة الصرف');
      }
    };
  });

  list.querySelectorAll('.edit-btn-icon').forEach(btn=>{
    btn.onclick = ()=>{
      const c = state.monthly.find(x=>x.id===btn.dataset.id);
      if(!c) return;
      openEditModal('تعديل بيانات العميل الشهري', `
        <label>اسم العميل</label><input type="text" id="edMName" value="${esc(c.name)}">
        <label>رقم الموبايل</label><input type="tel" id="edMPhone" value="${esc(c.phone)}">
        <label>يوم الاستحقاق</label><input type="number" id="edMDue" value="${c.dueDay}">
        <label>كود الزميل</label><input type="text" id="edMStaff" value="${esc(c.staffCode)}">
      `, async (modal)=>{
        c.name = modal.querySelector('#edMName').value.trim();
        c.phone = modal.querySelector('#edMPhone').value.trim();
        c.dueDay = Number(modal.querySelector('#edMDue').value) || 1;
        c.staffCode = modal.querySelector('#edMStaff').value.trim();
        await sbUpdate('monthly_customers', c.id, buildMonthlyRow(c));
        await fetchMonthlyCustomers();
        renderMonthlyList();
        showToast('تم التعديل بنجاح');
      });
    };
  });
}

/* TAB 5: قاعدة البيانات والأصناف */
function mountDatabaseTab(root){
  root.innerHTML = `
    <div class="card">
      <p class="section-title">إضافة / ربط صنف جديد في القاموس الذكي</p>
      <p style="font-size:12.5px;color:var(--muted);margin:0 0 10px;">قم بتسجيل أرقام الأصناف وأسمائها لكي يتم استدعاؤها تلقائياً عند إدخال رقم الصنف في أي قسم باللوحة.</p>
      <label>رقم الصنف (Item No)</label><input type="text" id="dbCode" placeholder="مثال: 10234">
      <label>اسم وصف الصنف (Item Description)</label><input type="text" id="dbDesc" placeholder="اسم الدواء أو الصنف بالكامل">
      <button class="btn" id="dbSaveBtn">حفظ في القاموس</button>
    </div>

    <div class="card">
      <div class="section-title">
        <span>قاموس الأصناف المحفوظة محلياً</span>
        <button class="refresh" id="dbRefresh">⟳ تحديث</button>
      </div>
      <div class="searchbar"><input type="search" id="dbSearch" placeholder="ابحث برقم الصنف أو الاسم..."></div>
      <div id="dbList"></div>
    </div>
  `;

  root.querySelector('#dbSaveBtn').onclick = ()=>{
    const code = document.getElementById('dbCode').value.trim();
    const desc = document.getElementById('dbDesc').value.trim();
    if(!code || !desc){ showToast('من فضلك ادخل رقم واسم الصنف'); return; }
    itemDatabase[code] = desc;
    localStorage.setItem('ph_item_database', JSON.stringify(itemDatabase));
    document.getElementById('dbCode').value = '';
    document.getElementById('dbDesc').value = '';
    renderDbList();
    showToast('تم حفظ الصنف في القاموس الذكي');
  };

  root.querySelector('#dbSearch').oninput = ()=>renderDbList();
  root.querySelector('#dbRefresh').onclick = ()=>renderDbList();
  renderDbList();
}

function renderDbList(){
  const list = document.getElementById('dbList');
  if(!list) return;
  const q = (document.getElementById('dbSearch')?.value || '').trim().toLowerCase();
  const keys = Object.keys(itemDatabase).filter(k=>{
    if(!q) return true;
    return k.toLowerCase().includes(q) || itemDatabase[k].toLowerCase().includes(q);
  });

  if(keys.length===0){ list.innerHTML = `<div class="empty-state">لا توجد أصناف مسجلة في القاموس حالياً</div>`; return; }

  list.innerHTML = keys.map((k, idx)=>`
    <div class="item-card" style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-weight:800;font-size:14px;color:var(--primary-dark);">رقم الصنف: ${esc(k)}</div>
        <div style="font-size:13px;color:var(--text);margin-top:2px;">الاسم: ${esc(itemDatabase[k])}</div>
      </div>
      <button class="btn small danger dbDelBtn" data-code="${k}">حذف</button>
    </div>
  `).join('');

  list.querySelectorAll('.dbDelBtn').forEach(btn=>{
    btn.onclick = ()=>{
      const code = btn.dataset.code;
      delete itemDatabase[code];
      localStorage.setItem('ph_item_database', JSON.stringify(itemDatabase));
      renderDbList();
      showToast('تم حذف الصنف من القاموس');
    };
  });
}

/* Initialize App on load */
async function initApp(){
  initNightMode();
  showToast('جاري مزامنة البيانات من السحابة لكافة الشاشات...');
  try {
    await Promise.all([
      fetchStockIssues(),
      fetchReservations(),
      fetchMonthlyCustomers()
    ]);
    showToast('تمت المزامنة السحابية بنجاح');
  } catch(e) {
    showToast('تعذر الاتصال بالسحابة، يتم استخدام النسخ المخزنة');
  }
  renderTabsNav();
  renderActiveTab();
}

window.onload = initApp;
</script>
